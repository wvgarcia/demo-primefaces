<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Registrar Nuevo Usuario</title>
    </h:head>

    <h:body>
        <p:messages id="msjRegistrar" showDetail="true" closable="true">
            <p:autoUpdate/>
        </p:messages>
        
        <h:form>
            <h:panelGrid columns="2" cellpadding="5">
                <h:outputLabel for="usuario" value="Usuario:" />
                <p:inputText id="usuario" value="#{registro.usuario}" required="true" />

                <h:outputLabel for="clave" value="Clave:" />
                <p:password id="clave" value="#{registro.clave}" required="true" />
            </h:panelGrid>

            <p:commandButton value="Guardar" action="#{registro.registrarUsuario()}" update="@form" />
        </h:form>

    </h:body>
</html>
